[project]
name = "analysis-worker"
version = "0.1.0"
description = "Analyzes code changes and performs architectural validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-instrumentation-aiokafka>=0.62b1",
    "python-schema-registry-client>=2.6.1",
    "fastavro>=1.12.2",
    "litellm>=1.85.0",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
