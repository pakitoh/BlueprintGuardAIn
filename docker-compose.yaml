networks:
  guardain-net:
    driver: bridge
  grafana-net:
    external: true

services:

  # Database with Vector Support
  postgres:
    image: ankane/pgvector:latest
    container_name: guardain_analysis_pg
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/analysis-db-init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./scripts/dashboard-db-init.sql:/docker-entrypoint-initdb.d/dashboard-init.sql
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - guardain-net

  kafka:
    image: apache/kafka:latest
    container_name: guardain_kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Use KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - guardain-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: guardain_kafka_ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      - kafka
      - schema-registry
    networks:
      - guardain-net

  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: guardain_schema_registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:9092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      - kafka
    networks:
      - guardain-net


  # Application services — opt-in via: docker compose --profile app up
  ingestion-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: ingestion-service/Dockerfile
      target: app
    container_name: guardain_ingestion_service
    ports:
      - "8000:8000"
    environment:
      INGESTION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INGESTION_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      INGESTION_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      INGESTION_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      - kafka
      - schema-registry
    networks:
      - guardain-net
      - grafana-net

  analysis-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: analysis-worker/Dockerfile
      target: app
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: guardain_analysis_worker
    environment:
      ANALYSIS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYSIS_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ANALYSIS_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ANALYSIS_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/analysis_db
      ANALYSIS_LLM_CONFIGS: ${ANALYSIS_LLM_CONFIGS}
      ANALYSIS_EMBEDDING_CONFIGS: ${ANALYSIS_EMBEDDING_CONFIGS}
      ANALYSIS_GITHUB_TOKEN: ${ANALYSIS_GITHUB_TOKEN}
      ANALYSIS_LANGFUSE_PUBLIC_KEY: ${ANALYSIS_LANGFUSE_PUBLIC_KEY:-}
      ANALYSIS_LANGFUSE_SECRET_KEY: ${ANALYSIS_LANGFUSE_SECRET_KEY:-}
      ANALYSIS_LANGFUSE_HOST: ${ANALYSIS_LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - kafka
      - schema-registry
      - postgres
    networks:
      - guardain-net
      - grafana-net

  notification-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: notification-worker/Dockerfile
      target: app
    container_name: guardain_notification_worker
    environment:
      NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      NOTIFICATION_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      NOTIFICATION_GITHUB_TOKEN: ${NOTIFICATION_GITHUB_TOKEN}
      NOTIFICATION_SLACK_WEBHOOK_URL: ${NOTIFICATION_SLACK_WEBHOOK_URL}
    depends_on:
      - kafka
      - schema-registry
    networks:
      - guardain-net
      - grafana-net

  dashboard-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: dashboard-service/Dockerfile
      target: app
    container_name: guardain_dashboard_service
    ports:
      - "8002:8002"
    environment:
      DASHBOARD_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DASHBOARD_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      DASHBOARD_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DASHBOARD_POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/dashboard_db
      DASHBOARD_INGESTION_URL: http://ingestion-service:8000/webhooks/github
      DASHBOARD_GITHUB_TOKEN: ${DASHBOARD_GITHUB_TOKEN}
      DASHBOARD_WEBHOOK_SECRET: ${WEBHOOK_SECRET}
    depends_on:
      - kafka
      - schema-registry
      - postgres
      - ingestion-service
    networks:
      - guardain-net
      - grafana-net
