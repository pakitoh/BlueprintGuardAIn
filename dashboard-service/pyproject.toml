[project]
name = "dashboard-service"
version = "0.1.0"
description = "Dashboard for triggering and visualising Blueprint GuardAIn analyses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "structlog>=25.5.0",
    "aiokafka>=0.14.0",
    "fastavro>=1.12.2",
    "python-schema-registry-client>=2.6.1",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-aiokafka>=0.62b1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-logging>=0.62b1",
    "opentelemetry-sdk>=1.41.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]
