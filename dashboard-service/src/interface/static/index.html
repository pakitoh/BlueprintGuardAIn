<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blueprint GuardAIn</title>
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
</head>
<body>
<header>
  <img src="/static/logo.png" alt="Blueprint GuardAIn" />
  <h1>Blueprint GuardAIn</h1>
</header>
<main>
  <aside id="sidebar">
    <h2>Actions</h2>
    <div id="tabs">
      <button class="tab active" data-tab="random">Random</button>
      <button class="tab" data-tab="historical">Historical</button>
    </div>
    <div id="tab-random" class="tab-content" style="display:flex">
      <button id="trigger">▶ Run random analysis</button>
    </div>
    <div id="tab-historical" class="tab-content" style="display:none">
      <select id="repo-select"><option value="">— select a repo —</option></select>
      <p class="tab-or">or enter a custom repo:</p>
      <input id="repo-custom" type="text" placeholder="owner/repo" />
      <button id="trigger-replay">▶ Next commit</button>
      <p id="replay-msg" class="replay-msg" style="display:none"></p>
    </div>
    <h2>Recent analyses</h2>
    <div id="cards"></div>
  </aside>
  <section id="detail">
    <p class="empty">Select an analysis or trigger a new one.</p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
